# Skin (sys-therm-0) set-point mitigation ahead of the QTI fail-safe rules

[SKIN-SS-CPU-PRIME]
algo_type ss
sampling 1000
sensor sys-therm-0
device cpu-cluster2
set_point 44000
set_point_clr 41000
time_constant 2
device_max_limit 1459200

[SKIN-SS-CPU-GOLD]
algo_type ss
sampling 1000
sensor sys-therm-0
device cpu-cluster1
set_point 46000
set_point_clr 43000
time_constant 2
device_max_limit 1286400

[SKIN-SS-GPU]
algo_type ss
sampling 1000
sensor sys-therm-0
device gpu
set_point 46000
set_point_clr 43000
time_constant 2
device_max_limit 510000000
